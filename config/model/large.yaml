# Konoros-Sec large: ~300M params, GQA (20q/5kv), ctx 2048. Cần GPU ≥24GB (A100).
# Tokenizer: BPE 16000 (scripts/train_bpe.py). Data GB-scale, train nhiều session + resume.
model:
  vocab_size: 16000
  d_model: 1280
  n_layers: 16
  n_heads: 20
  n_kv_heads: 5
  context_length: 2048
  dropout: 0.0
  rope_theta: 10000.0
  tie_weights: true
  norm: rmsnorm
  mlp: swiglu
  bos_id: 2
  eos_id: 3
  pad_id: 0
  unk_id: 1

training:
  batch_size: 4
  grad_accum_steps: 16  # effective batch 64 x 2048 ctx (~131k tok/step)
  grad_checkpoint: true
  epochs: 1
  lr: 2e-4
  weight_decay: 0.1
  betas: [0.9, 0.95]
  grad_clip: 1.0
  max_steps: 100000
  warmup_steps: 2000
  eval_interval: 1000
  save_interval: 2000
  device: cuda
  dtype: bfloat16
  seed: 42

data:
  train_path: data/processed/train.bin
  val_path: data/processed/val.bin

tokenizer:
  type: bpe
  path: data/tokenizer/bpe.json

checkpoint:
  dir: experiments/large/checkpoints
  log_dir: experiments/large/logs

reasoning:
  enabled: false
  think_bos: "<think>"
  think_eos: "</think>"
  answer_bos: "<answer>"
  answer_eos: "</answer>"
  max_think_tokens: 512

sft:
  enabled: false
  base_ckpt: ""
  data_path: "data/sft/security_sft.jsonl"
  max_steps: 2000
  lr: 1e-5
  mask_prompt: true

grpo:
  enabled: false
  data_path: "data/sft/security_reasoning.jsonl"
  steps: 1000
  group: 4
  lr: 1e-6
  beta: 0.02
  eps: 0.2
  max_new_tokens: 128

dpo:
  enabled: false
  data_path: "data/sft/security_prefs.jsonl"
  steps: 1000
  lr: 5e-6
  beta: 0.1

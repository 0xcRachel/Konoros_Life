model:
  vocab_size: 260
  d_model: 256
  n_layers: 4
  n_heads: 4
  context_length: 512
  dropout: 0.0
  rope_theta: 10000.0
  tie_weights: true

training:
  batch_size: 32
  lr: 3e-4
  weight_decay: 0.1
  betas: [0.9, 0.95]
  grad_clip: 1.0
  max_steps: 5000
  warmup_steps: 200
  eval_interval: 500
  save_interval: 1000
  device: cuda
  dtype: bfloat16
  seed: 42

data:
  train_path: data/processed/train.bin
  val_path: data/processed/val.bin

tokenizer:
  type: byte
  path: data/tokenizer/byte.json

checkpoint:
  dir: experiments/v0.1/checkpoints
  log_dir: experiments/v0.1/logs